# Config declarativa minima. `supabase config push` so altera o que esta declarado aqui.
# Projeto remoto: visor-screen (gyqnzjjvugrfpbnfjbrf), org yaaggo's, sa-east-1.
project_id = "gta-screen"

[auth]
site_url = "https://visor-screen.vercel.app"
additional_redirect_urls = ["http://localhost:5173"]
# Login: usuario + senha curta (1-4 caracteres). Conta = e-mail sintetico <nome>@visor-screen.vercel.app
# com senha "visor-pin:<senha>" (o Supabase exige 6+). Nenhum e-mail e enviado.
enable_anonymous_sign_ins = false
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
# tentativas de login/cadastro por 5 min por IP (freia forca bruta na senha curta)
sign_in_sign_ups = 30
